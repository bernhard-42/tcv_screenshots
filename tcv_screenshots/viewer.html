<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            body {
                margin: 0;
            }
        </style>
        <link rel="stylesheet" href="./static/three-cad-viewer.css" />
    </head>
    <body>
        <div id="cad_viewer"></div>
        <script type="module">
            import { Viewer, Display, Timer } from "./static/three-cad-viewer.esm.js";
            import { createPage } from "./static/ocp-viewer-core/index.js";

            // createPage takes the canvas size from the surface it measures,
            // less what it reserves around the canvas: 20px of width and the
            // chrome above the canvas (65px assumed until a canvas exists).
            // The surface reported here is the requested canvas plus that
            // reserve; render.py checks the size of every captured image
            // against the request.
            const reserve = { width: 20, height: 65 };
            let canvas = { width: 1200, height: 800 };

            // Screenshots answer through `send`, keyed by the name asked for
            const pendingImages = new Map();
            // The viewer's state as reported by the page, camera included
            const status = {};

            function send(command, message) {
                if (command === "screenshot") {
                    const resolve = pendingImages.get(message.filename);
                    if (resolve !== undefined) {
                        pendingImages.delete(message.filename);
                        resolve(message.data);
                    }
                } else if (command === "status") {
                    Object.assign(status, message);
                } else if (command === "log") {
                    // The page's debug lines; shown by tcv_screenshots --debug
                    console.log(message);
                }
            }

            const page = createPage({
                Viewer,
                Display,
                Timer,
                send,
                theme: "light",
                overrides: {
                    display: { treeWidth: 0, glass: true, tools: false, theme: "light" },
                    viewer: {}
                },
                // No window listeners: models arrive by loadModel, and the
                // size is decided per screenshot, not by the window
                listen: false,
                getSize: () => ({
                    width: canvas.width + reserve.width,
                    height: canvas.height + reserve.height
                })
            });

            // Fetch a data message from the local server and show it
            window.loadModel = async (url) => {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`fetching ${url}: HTTP ${response.status}`);
                }
                const message = await response.json();
                canvas = { width: message.config.cadWidth, height: message.config.height };
                page.handleMessage(message);
                // Before the first canvas exists the page assumes its chrome;
                // from then on it measures the canvas offset in the container
                // (same selector as page.js), so reserve exactly that
                const container = document.getElementById("cad_viewer");
                const view = container.querySelector(".tcv_cad_view_glass, .tcv_cad_view");
                if (view !== null) {
                    const offset = Math.round(
                        view.getBoundingClientRect().top - container.getBoundingClientRect().top
                    );
                    if (offset > 0) {
                        reserve.height = offset;
                    }
                }
                // The page builds its Display once and resizes only when told:
                // without this every screenshot keeps the first one's size
                page.resize();
            };

            // Scale an image down to the requested canvas size. Studio mode
            // renders supersampled (pixel ratio >= 2, three-cad-viewer
            // studio-manager.ts), so its capture is a multiple of the canvas
            // and is meant to be seen downsampled.
            function toCanvasSize(dataUrl) {
                return new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => {
                        const scaleX = image.naturalWidth / canvas.width;
                        const scaleY = image.naturalHeight / canvas.height;
                        if (scaleX === 1 && scaleY === 1) {
                            resolve(dataUrl);
                            return;
                        }
                        if (scaleX !== scaleY || scaleX < 1) {
                            // Not a supersampled capture: let render.py report it
                            resolve(dataUrl);
                            return;
                        }
                        const target = document.createElement("canvas");
                        target.width = canvas.width;
                        target.height = canvas.height;
                        const context = target.getContext("2d");
                        context.imageSmoothingEnabled = true;
                        context.imageSmoothingQuality = "high";
                        context.drawImage(image, 0, 0, canvas.width, canvas.height);
                        resolve(target.toDataURL("image/png"));
                    };
                    image.onerror = () => reject(new Error("captured image cannot be decoded"));
                    image.src = dataUrl;
                });
            }

            // The captured image as data URL, or null while the viewer is not
            // ready to render
            window.getImage = (name) =>
                new Promise((resolve) => {
                    pendingImages.set(name, resolve);
                    page.handleMessage({ type: "screenshot", filename: name });
                }).then((dataUrl) => (dataUrl === null ? null : toCanvasSize(dataUrl)));

            // Camera after user interaction (--pause), to copy into save_model
            window.getCamera = () => ({
                position: status.position,
                quaternion: status.quaternion,
                target: status.target,
                zoom: status.zoom
            });

            window.viewerLoaded = true;
        </script>
    </body>
</html>
