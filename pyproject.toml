[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcv-screenshots"
version = "1.1.0"
description = "Headless screenshot generator for three-cad-viewer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bernhard Walter" }]
dependencies = [
    "playwright>=1.40.0",
    # major.minor must match the bundled ocp-viewer-core JavaScript (1.2.x)
    "ocp-viewer-core>=1.2.0,<1.3.0",
    # not imported directly: ocp-tessellate 3.7 brings the kernel plugins and
    # the builder color fix; ocp-viewer-core 1.2 requires the same range
    "ocp-tessellate>=3.7.0,<3.8.0",
]

[project.scripts]
# installed as bin/tcv_screenshots (macOS, Linux) or Scripts\tcv_screenshots.exe (Windows)
tcv_screenshots = "tcv_screenshots.__main__:main"

[project.optional-dependencies]
dev = ["build", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: renders in headless Chromium (needs `playwright install chromium`)",
]

[tool.setuptools.packages.find]
include = ["tcv_screenshots*"]

[tool.setuptools.package-data]
tcv_screenshots = ["*.html", "static/*.js", "static/*.css", "static/ocp-viewer-core/*.js"]
